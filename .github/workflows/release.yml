# LOCAL: tag-triggered release builds for this fork.
# Produces the CLI binary (`xai-grok-pager`, the `grok` CLI) for the two
# desktop targets this fork ships: linux-amd64 and windows-amd64. Cut a
# release by pushing a `v*` tag; the assets land on the GitHub release the
# tag names. Protoc matches the pinned version build.yml verifies.
#
# Compile cache: Swatinem/rust-cache with shared-key `release`, isolated from
# build.yml's debug target/. The two workflows used to share job names
# (`linux`/`windows`), so rust-cache restored debug artifacts into release
# jobs and every tag rebuilt the full dependency tree (~50 min on Windows).
# sccache's GHA backend was tried next and wrote 5k+ cache fragments that
# exhausted the 10 GB quota at 0% hit on Windows release. One rust-cache
# blob per OS is the pattern helix/clap/starship/tauri/polars use.
#
# Windows: Defender real-time scanning off (rust-lang CI does this) and
# rust-lld instead of link.exe (v1.0.27 spent ~12 min in the final MSVC link).
#
# workflow_dispatch runs the identical build on a branch ref (packaging and
# upload are guarded to tag refs) — used to warm the release cache before
# cutting a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
        with:
          cache-scope: release
      - name: Build release binary
        run: |
          # xai-grok-version falls back to its Cargo.toml version unless
          # GROK_VERSION is injected at compile time, so stamp it from the tag
          # (v1.0.27 -> 1.0.27) or every release reports the stale lockstep
          # value. Branch builds (workflow_dispatch) keep the fallback.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            export GROK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cargo build --locked --release -p xai-grok-pager-bin
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/release
          tar czf "grok-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" xai-grok-pager
          sha256sum "grok-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" > "grok-${GITHUB_REF_NAME}-x86_64-linux.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/grok-${{ github.ref_name }}-x86_64-linux.tar.gz
            target/release/grok-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # CI-only linker swap (see the rust-lld PATH step): CI links with
      # rust-lld while local dev builds stay on MSVC link.exe until lld is
      # validated for local use too.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
        with:
          cache-scope: release
      - name: Put rust-lld on PATH
        # lld-link links the final binary several times faster than link.exe;
        # v1.0.27 spent ~12 minutes in that final link alone. Fails loudly if
        # the toolchain layout ever moves rust-lld.
        shell: pwsh
        run: |
          $lldDir = Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin"
          if (-not (Test-Path (Join-Path $lldDir "rust-lld.exe"))) {
            throw "rust-lld.exe not found under $lldDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $lldDir
      - name: Build release binary
        shell: bash
        run: |
          # Same tag stamping as the linux job: without GROK_VERSION the
          # binary falls back to the stale Cargo.toml version.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            export GROK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cargo build --locked --release -p xai-grok-pager-bin
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/xai-grok-pager.exe `
            -DestinationPath "target/release/grok-${{ github.ref_name }}-x86_64-windows.zip"
          $hash = (Get-FileHash "target/release/grok-${{ github.ref_name }}-x86_64-windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  grok-${{ github.ref_name }}-x86_64-windows.zip" |
            Set-Content "target/release/grok-${{ github.ref_name }}-x86_64-windows.zip.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/grok-${{ github.ref_name }}-x86_64-windows.zip
            target/release/grok-${{ github.ref_name }}-x86_64-windows.zip.sha256
