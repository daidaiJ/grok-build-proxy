# LOCAL: tag-triggered release builds for this fork.
# Produces the CLI binary (`xai-grok-pager`, the `grok` CLI) for the two
# desktop targets this fork ships: linux-amd64 and windows-amd64. Cut a
# release by pushing a `v*` tag; the assets land on the GitHub release the
# tag names. Protoc matches the pinned version build.yml verifies.
#
# Compile cache: sccache with the GitHub Actions backend. rust-cache's
# target/ cache here only ever held debug artifacts from build.yml (the two
# workflows share job names, so restore hit but helped nothing), which made
# every tag rebuild the full release dependency tree (~50 min on Windows).
# sccache is content-addressed and shared with build.yml's main-branch runs,
# so a tag build only recompiles crates that actually changed. This requires
# incremental to stay off in CI (env override below): sccache refuses to
# cache incremental compilations, and a one-shot CI build gains nothing
# from it.
#
# workflow_dispatch runs the identical build on a branch ref (packaging and
# upload are guarded to tag refs) — used to warm the sccache cache before
# cutting a tag and to benchmark without releasing.
#
# Windows hardening: Defender real-time scanning off, rust-lld linker, and a
# strict sccache stats check. On v1.0.27 the windows job compiled 991 crates
# while sccache's server only saw 4 requests and still reported "100% hits"
# (its stats reset mid-build); the stats step now fails the job when the
# cache silently bypasses most of the build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  # Env profile overrides win over the manifest's [profile.release]
  # incremental = true (which exists for local dev rebuilds). Note cargo
  # only accepts "true"/"false" for boolean profile env vars.
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
  # Surface sccache server errors (e.g. ghac upload failures) in the stats step.
  SCCACHE_ERROR_LOG: sccache-error.log
  # Request-level server logging lands in SCCACHE_ERROR_LOG; the stats step's
  # request-count assert reads it when a build goes out without cache hits.
  SCCACHE_SERVER_LOG: debug

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml. Pinning here avoids
          # installing latest stable only for rustup to fetch the pinned
          # toolchain again inside the build step, and keeps sccache keys
          # stable across runs.
          toolchain: "1.94.0"
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          # sccache owns compiled-artifact caching; storing target/ here would
          # only burn repo cache quota on files restore never needed.
          cache-targets: false
      - name: Install protoc
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          mkdir -p "$HOME/.local/protoc"
          unzip -o /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: |
          # xai-grok-version falls back to its Cargo.toml version unless
          # GROK_VERSION is injected at compile time, so stamp it from the tag
          # (v1.0.27 -> 1.0.27) or every release reports the stale lockstep
          # value. Branch builds (workflow_dispatch) keep the fallback.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            export GROK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cargo build --release -p xai-grok-pager-bin 2>&1 | tee cargo-build.log
          exit "${PIPESTATUS[0]}"
      - name: sccache stats
        run: |
          sccache --show-stats | tee sccache-stats.log
          if [ -f sccache-error.log ]; then tail -30 sccache-error.log; fi
          requests=$(awk '/^Compile requests +[0-9]/ {print $3}' sccache-stats.log)
          compiled=$(grep -c Compiling cargo-build.log)
          echo "sccache requests=${requests:-0}, cargo compiled=${compiled:-0}"
          if [ "${requests:-0}" -lt $(( ${compiled:-0} * 9 / 10 )) ]; then
            echo "::error::sccache served ${requests:-0} of ${compiled:-0} rustc invocations - the compile cache silently bypassed most of this build. Check the server log above; once the backend recovers, re-run so the release is not shipped cold."
            exit 1
          fi
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/release
          tar czf "grok-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" xai-grok-pager
          sha256sum "grok-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" > "grok-${GITHUB_REF_NAME}-x86_64-linux.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/grok-${{ github.ref_name }}-x86_64-linux.tar.gz
            target/release/grok-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # CI-only linker swap (see the rust-lld PATH step): CI links with
      # rust-lld while local dev builds stay on MSVC link.exe until lld is
      # validated for local use too.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - name: Disable Defender real-time scanning
        # windows-latest ships with real-time protection ON; Defender audits
        # every object-file write and rustc spawn, worth ~1.3-2x on a build
        # this size (rust-lang's own CI does the same). The runner is an
        # ephemeral single-use VM, so the exposure window is one job. Skip
        # silently if policy blocks it rather than failing the release.
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml (see the linux job).
          toolchain: "1.94.0"
      - name: Put rust-lld on PATH
        # lld-link links the final binary several times faster than link.exe;
        # v1.0.27 spent ~12 minutes in that final link alone. Fails loudly if
        # the toolchain layout ever moves rust-lld.
        shell: pwsh
        run: |
          $lldDir = Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin"
          if (-not (Test-Path (Join-Path $lldDir "rust-lld.exe"))) {
            throw "rust-lld.exe not found under $lldDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $lldDir
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install protoc
        # Direct download instead of choco: the community feed served a 504
        # once and choco still exited 0, failing the build much later with
        # "protoc not found". Mirrors the linux job's pinned download.
        shell: pwsh
        run: |
          curl -fsSL --retry 3 -o "$env:RUNNER_TEMP/protoc.zip" `
            https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-win64.zip
          New-Item -ItemType Directory -Force "$HOME/.local/protoc" | Out-Null
          Expand-Archive -Force "$env:RUNNER_TEMP/protoc.zip" "$HOME/.local/protoc"
          "$HOME/.local/protoc/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$HOME/.local/protoc/bin/protoc.exe" --version
      - name: Build release binary
        shell: bash
        run: |
          # Same tag stamping as the linux job: without GROK_VERSION the
          # binary falls back to the stale Cargo.toml version.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            export GROK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cargo build --release -p xai-grok-pager-bin 2>&1 | tee cargo-build.log
          exit "${PIPESTATUS[0]}"
      - name: sccache stats
        shell: bash
        run: |
          sccache --show-stats | tee sccache-stats.log
          if [ -f sccache-error.log ]; then tail -30 sccache-error.log; fi
          requests=$(awk '/^Compile requests +[0-9]/ {print $3}' sccache-stats.log)
          compiled=$(grep -c Compiling cargo-build.log)
          echo "sccache requests=${requests:-0}, cargo compiled=${compiled:-0}"
          if [ "${requests:-0}" -lt $(( ${compiled:-0} * 9 / 10 )) ]; then
            echo "::error::sccache served ${requests:-0} of ${compiled:-0} rustc invocations - the compile cache silently bypassed most of this build. Check the server log above; once the backend recovers, re-run so the release is not shipped cold."
            exit 1
          fi
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/xai-grok-pager.exe `
            -DestinationPath "target/release/grok-${{ github.ref_name }}-x86_64-windows.zip"
          $hash = (Get-FileHash "target/release/grok-${{ github.ref_name }}-x86_64-windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  grok-${{ github.ref_name }}-x86_64-windows.zip" |
            Set-Content "target/release/grok-${{ github.ref_name }}-x86_64-windows.zip.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/grok-${{ github.ref_name }}-x86_64-windows.zip
            target/release/grok-${{ github.ref_name }}-x86_64-windows.zip.sha256
