# LOCAL: tag-triggered release builds for this fork.
# Produces the CLI binary (`xai-grok-pager`, the `grok` CLI) for the two
# desktop targets this fork ships: linux-amd64 and windows-amd64. Cut a
# release by pushing a `v*` tag; the assets land on the GitHub release the
# tag names. Protoc matches the pinned version build.yml verifies.
#
# Compile cache: Swatinem/rust-cache with shared-key `release` (linux native)
# / `release-xwin` (windows-msvc cross). Isolated from build.yml's debug
# target/. The two workflows used to share job names (`linux`/`windows`), so
# rust-cache restored debug artifacts into release jobs and every tag rebuilt
# the full dependency tree (~50 min on windows-latest). sccache's GHA backend
# was tried next and wrote 5k+ cache fragments that exhausted the 10 GB quota
# at 0% hit on Windows release.
#
# Windows artifacts are cross-compiled on ubuntu-24.04 with cargo-xwin
# (clang-cl + the MSVC SDK). Native windows-latest compiled 991 crates in
# ~47 min (v1.0.29, cache miss) and still spent ~13 min in the final link
# even with rust-lld. Linux hosted the same tree in ~27 min; cross-compile
# keeps that CPU and drops the Windows runner.
#
# Workspace crates are kept in the rust-cache blob. That only helps if git
# mtimes survive checkout (cargo fingerprints by mtime, not content).
# fetch-depth: 0 + git-restore-mtime is the helix / rust-cache#37 pattern.
#
# workflow_dispatch runs the identical build on a branch ref (packaging and
# upload are guarded to tag refs) — used to warm the release cache before
# cutting a tag.
#
# Do not cancel-in-progress. rust-cache saves on post even after a cancel,
# under the exact key; a 3-minute cancelled compile (v1.0.28) wrote a 454 MB
# blob, the successful run treated it as a full hit, skipped save, and
# Windows rebuilt from scratch for 50 minutes. Keep the in-flight job.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: chetan/git-restore-mtime-action@v2
      - uses: ./.github/actions/ci-setup
        with:
          cache-scope: release
          cache-targets: "true"
          cache-workspace-crates: "true"
          # The build is the only long step; a post-build failure (asset
          # upload) leaves a complete, valid tree worth caching for the
          # rerun. Trade-off: a build-stage failure also saves, and its
          # partial tree then occupies the exact key until Cargo.lock
          # changes — bounded at the workspace-rebuild cost a rerun already
          # pays (deps stay complete in the blob), never a 50-min full
          # rebuild like the v1.0.28 cancel-poisoning.
          cache-on-failure: "true"
      - name: Build release binary
        run: |
          # xai-grok-version falls back to its Cargo.toml version unless
          # GROK_VERSION is injected at compile time, so stamp it from the tag
          # (v1.0.27 -> 1.0.27) or every release reports the stale lockstep
          # value. Branch builds (workflow_dispatch) keep the fallback.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            export GROK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cargo build --locked --release -p xai-grok-pager-bin
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # LOCAL: binary ships as `grok2` so it never collides with the official
          # `grok` install (~/.grok/bin/grok) or needs a manual rename.
          cd target/release
          mv xai-grok-pager grok2
          tar czf "grok2-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" grok2
          sha256sum "grok2-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" > "grok2-${GITHUB_REF_NAME}-x86_64-linux.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/grok2-${{ github.ref_name }}-x86_64-linux.tar.gz
            target/release/grok2-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

  windows:
    # Cross-compile windows-msvc on Linux. See the file header for why.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: chetan/git-restore-mtime-action@v2
      - name: Install clang / lld / ninja / zip
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y clang lld ninja-build zip
      - uses: ./.github/actions/ci-setup
        with:
          cache-scope: release-xwin
          cache-targets: "true"
          cache-workspace-crates: "true"
          rust-targets: x86_64-pc-windows-msvc
          rust-components: llvm-tools
          # Same reasoning as the linux job: build completes before upload.
          cache-on-failure: "true"
      - name: Cache MSVC SDK (xwin)
        uses: actions/cache@v4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-sdk-17-${{ runner.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      - name: Build release binary
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            export GROK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cargo xwin build --locked --release -p xai-grok-pager-bin \
            --target x86_64-pc-windows-msvc
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # LOCAL: same `grok2` binary name as the linux job.
          cd target/x86_64-pc-windows-msvc/release
          mv xai-grok-pager.exe grok2.exe
          zip "grok2-${GITHUB_REF_NAME}-x86_64-windows.zip" grok2.exe
          sha256sum "grok2-${GITHUB_REF_NAME}-x86_64-windows.zip" > "grok2-${GITHUB_REF_NAME}-x86_64-windows.zip.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/grok2-${{ github.ref_name }}-x86_64-windows.zip
            target/x86_64-pc-windows-msvc/release/grok2-${{ github.ref_name }}-x86_64-windows.zip.sha256
