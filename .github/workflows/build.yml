# LOCAL: minimal build workflow for this fork.
# The upstream monorepo CI is not usable here (internal runners, DotSlash
# tools, secrets). This keeps only what a fork needs: compile checks and the
# test suites for the crates this fork actually touches, on both Linux and
# Windows. `bin/protoc` is a DotSlash stub that cannot run on CI; the
# xai-proto-build helper falls back to a PATH protoc, which each job installs.
#
# Cache: Swatinem/rust-cache with shared-key `build`, isolated from release.yml.
# Only ~/.cargo (cache-targets: false). Debug target/ is ~3.5 GB, is touched
# on every main/PR run, and GitHub's 10 GB LRU evicts the colder release
# blobs first — which is why a "fitting" four-blob budget still lost the
# Windows --release cache. sccache's GHA backend is not used.
name: build

on:
  push:
    branches: [main]
    # Docs-only commits can't change the binary; skip the build for them.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "docs-local/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "docs-local/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs. Do not cancel main: rust-cache post still
  # saves after a cancel and a partial blob poisons the exact key.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Some session-lifecycle tests recurse deeply enough to overflow the
  # libtest thread's default stack on Linux CI.
  RUST_MIN_STACK: 16777216

jobs:
  linux:
    runs-on: ubuntu-24.04
    # A deadlocked test must fail the job, not park it for the 6-hour GitHub default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
        with:
          cache-scope: build
          cache-targets: "false"
      # cargo test already type-checks the crates it covers. Only check the
      # crate this fork touches but does not test on CI.
      - name: Check untested crates
        run: cargo check --locked -p xai-grok-tools
      - name: Test touched crates
        run: >-
          cargo test --locked -p xai-grok-config -p xai-chat-state -p xai-grok-status-line
          -p xai-grok-extra-ca -p xai-proto-build -p xai-grok-hooks -p xai-grok-agent
      # Name-filtered runs: the pager's full suite is not exercised by this
      # fork; these cover the fork's own additions (stats aggregation, the
      # /stats modal cards, the built-in status-line segments incl. the guide
      # doc-sync). `stats_modal` / `commands::stats` were added because the
      # local Windows loop costs 13-17 min per rebuild (shared-crate edits
      # cascade, no usable incremental cache), so these suites are verified
      # here instead.
      - name: Test pager additions
        run: >-
          cargo test --locked -p xai-grok-pager --
          stats_cmd status_line stats_modal commands::stats
      - name: Test shell (in-process harness)
        timeout-minutes: 20
        run: cargo test --locked -p xai-grok-shell --features test-support
      - name: Build CLI binary
        run: cargo build --locked -p xai-grok-pager-bin

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
        with:
          cache-scope: build
          cache-targets: "false"
      # Compile-only: several test suites are env-dependent (file locks, PATH
      # lookups) and are exercised on the Linux job instead.
      - name: Check untested crates
        run: >-
          cargo check --locked -p xai-grok-config -p xai-proto-build -p xai-grok-shell
          -p xai-grok-hooks -p xai-grok-agent
      - name: Test portable crates
        run: cargo test --locked -p xai-chat-state -p xai-grok-status-line -p xai-grok-extra-ca
