# Shared toolchain + cache setup for Linux/Windows CI.
#
# Community practice (helix, clap, starship, tauri, polars):
#   dtolnay/rust-toolchain then Swatinem/rust-cache with a shared-key that
#   isolates debug vs release. rust-cache already keys on runner OS/arch, so
#   Linux and Windows never share a blob.
#
# Do not use sccache's GitHub Actions backend here. It writes one cache entry
# per compilation unit (mozilla/sccache docs). This repo hit 5k+ fragments,
# blew the 10 GB quota, evicted rust-cache, and Windows release compiled from
# scratch at 0% sccache hit (~57 min).
name: ci-setup
description: Install Rust + protoc and restore an OS-scoped cargo cache.

inputs:
  cache-scope:
    description: rust-cache shared-key (build vs release). Isolates debug/release target dirs.
    required: true
  cache-targets:
    description: >
      Cache target/ as well as ~/.cargo. Release must (the Windows --release
      tree is ~50 min cold). Build should not: debug target/ is ~3.5 GB, is
      accessed on every main/PR run, and GitHub's 10 GB LRU then evicts the
      colder release blobs. Registry-only is enough for cargo fetch.
    required: false
    default: "true"
  cache-workspace-crates:
    description: >
      Keep workspace crate artifacts in the rust-cache blob. Useless without
      restoring git mtimes after checkout (cargo fingerprints by mtime).
      Release.yml does both; build.yml does not (it does not cache target/).
    required: false
    default: "false"
  rust-targets:
    description: Extra rustup targets for dtolnay/rust-toolchain (comma-separated).
    required: false
    default: ""
  rust-components:
    description: Extra rustup components (comma-separated).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Disable Defender real-time scanning
      if: runner.os == 'Windows'
      shell: pwsh
      # windows-latest ships with real-time protection ON; Defender audits
      # every object-file write and rustc spawn (~1.3-2x on a build this size;
      # rust-lang's own CI does the same). The runner is an ephemeral VM.
      run: Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

    - uses: dtolnay/rust-toolchain@master
      with:
        # Keep in sync with rust-toolchain.toml. Pinning here avoids installing
        # latest stable only for rustup to fetch the pinned toolchain again.
        toolchain: "1.94.0"
        targets: ${{ inputs.rust-targets }}
        components: ${{ inputs.rust-components }}

    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust
        shared-key: ${{ inputs.cache-scope }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}
        # false: a failed compile must not occupy the exact key. Cancelled
        # jobs still run this action's post (v1.0.28 poisoned release that
        # way); release.yml therefore also sets cancel-in-progress: false.
        cache-on-failure: false
        save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    - name: Install protoc (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -fsSL -o /tmp/protoc.zip \
          https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
        mkdir -p "$HOME/.local/protoc"
        unzip -o /tmp/protoc.zip -d "$HOME/.local/protoc"
        echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
        "$HOME/.local/protoc/bin/protoc" --version

    - name: Install protoc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        curl -fsSL --retry 3 -o "$env:RUNNER_TEMP/protoc.zip" `
          https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-win64.zip
        New-Item -ItemType Directory -Force "$HOME/.local/protoc" | Out-Null
        Expand-Archive -Force "$env:RUNNER_TEMP/protoc.zip" "$HOME/.local/protoc"
        "$HOME/.local/protoc/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        & "$HOME/.local/protoc/bin/protoc.exe" --version
